<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 960 470"><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="m0 0 10 5-10 5z"/></marker><marker id="b" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#4f46e5" d="m0 0 10 5-10 5z"/></marker></defs><rect width="960" height="470" fill="#fff" rx="14"/><text x="30" y="40" fill="#0f172a" font-size="15" font-weight="700">Apps without OIDC</text><text x="185" y="40" fill="#64748b" font-size="13">Sonarr, Radarr, qBittorrent…</text><rect width="160" height="80" x="30" y="60" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" rx="10"/><text x="110" y="106" fill="#0f172a" font-size="15" text-anchor="middle">Browser</text><rect width="320" height="80" x="290" y="60" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" rx="10"/><text x="450" y="92" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">Envoy Gateway</text><text x="450" y="114" fill="#334155" font-size="13" text-anchor="middle">SecurityPolicy: login + checks</text><text x="450" y="131" fill="#334155" font-size="13" text-anchor="middle">&lt;app&gt;_roles contains access</text><rect width="220" height="80" x="710" y="60" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" rx="10"/><text x="820" y="96" fill="#0f172a" font-size="15" text-anchor="middle">App</text><text x="820" y="117" fill="#64748b" font-size="13" text-anchor="middle">trusts Remote-User</text><path stroke="#475569" stroke-width="2" marker-end="url(#a)" d="M190 100h96"/><path stroke="#475569" stroke-width="2" marker-end="url(#a)" d="M610 100h96"/><rect width="640" height="90" x="290" y="190" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5" rx="10"/><text x="610" y="222" fill="#1e1b4b" font-size="15" font-weight="700" text-anchor="middle">Keycloak · browser-gated flow</text><text x="610" y="246" fill="#312e81" font-size="13" text-anchor="middle">sign in (password + 2FA)  →  gate &lt;app&gt;</text><text x="610" y="265" fill="#312e81" font-size="13" text-anchor="middle">deny if the user has none of the app&apos;s roles</text><path stroke="#4f46e5" stroke-dasharray="6 5" stroke-width="2" marker-end="url(#b)" marker-start="url(#b)" d="M450 140v46"/><text x="462" y="168" fill="#4f46e5" font-size="12">OIDC login</text><path stroke="#4f46e5" stroke-dasharray="6 5" stroke-width="2" marker-end="url(#b)" marker-start="url(#b)" d="M820 284v46"/><text x="832" y="312" fill="#4f46e5" font-size="12">OIDC login</text><text x="30" y="318" fill="#0f172a" font-size="15" font-weight="700">Apps with OIDC</text><text x="160" y="318" fill="#64748b" font-size="13">Immich, Paperless-ngx, Grafana…</text><rect width="160" height="80" x="30" y="334" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" rx="10"/><text x="110" y="380" fill="#0f172a" font-size="15" text-anchor="middle">Browser</text><rect width="320" height="80" x="290" y="334" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" rx="10"/><text x="450" y="370" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">Envoy Gateway</text><text x="450" y="392" fill="#334155" font-size="13" text-anchor="middle">routing only</text><rect width="220" height="80" x="710" y="334" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" rx="10"/><text x="820" y="370" fill="#0f172a" font-size="15" text-anchor="middle">App</text><text x="820" y="391" fill="#64748b" font-size="13" text-anchor="middle">reads &lt;app&gt;_roles</text><path stroke="#475569" stroke-width="2" marker-end="url(#a)" d="M190 374h96"/><path stroke="#475569" stroke-width="2" marker-end="url(#a)" d="M610 374h96"/><text x="30" y="450" fill="#64748b" font-size="12">Each app has its own Keycloak client and only ever sees its own roles.</text></svg>